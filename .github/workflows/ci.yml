name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Delta Lake jars
        uses: actions/cache@v6
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -v

      - name: Run the pipeline (14 days), reprocess a day, maintain
        run: |
          python -m lakehouse run --days 14
          python -m lakehouse process --date 2026-01-05
          python -m lakehouse changes --since 1
          python -m lakehouse maintain
          python -m lakehouse report | grep -v '^:: loading settings' | tee report.txt

      - name: Publish the report to the run summary
        run: |
          {
            echo "## Lakehouse report (14 daily batches)"
            echo '```'
            cat report.txt
            echo '```'
            echo "### Run record for the last batch"
            echo '```json'
            cat lake/_runs/2026-01-14.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
